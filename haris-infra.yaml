AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Haris operator dashboard — network, load balancer, identity and compute.
  One Fargate task behind an internet-facing ALB across two availability zones.
  The ECR repository and the three Secrets Manager secrets are deliberately NOT
  in this stack: they hold state that should outlive it, and they are created by
  hand so they can be inspected and screenshotted for the report appendix.

# ---------------------------------------------------------------------------
# Parameters
#
# CertificateArn is optional on purpose. Leave it empty and the stack serves
# plain HTTP on the load balancer's own DNS name — a complete, working
# deployment. Supply it later and the same stack gains an HTTPS listener, an
# HTTP->HTTPS redirect and a Route 53 alias record, with no rebuild.
# ---------------------------------------------------------------------------
Parameters:

  ImageUri:
    Type: String
    Description: >
      Full ECR image URI, addressed by DIGEST rather than by tag. The repository
      is immutable, so a tag cannot be overwritten in place — but the digest is
      what the task definition records, and that is what makes the deployment
      circuit breaker's rollback return to bytes that were actually tested rather
      than to whatever a name currently points at.
    Default: 007267918845.dkr.ecr.us-east-1.amazonaws.com/haris@sha256:39debb061fea785a44d2069db73ce4f3c84235a16aa25f39c7334135487c4100

  DashboardSecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the operator token. The value is
      injected into the task at start; it never appears in this template, in the
      image, or in version control.

  AuditKeySecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the audit-chain HMAC key.
      Without it the chain degrades to a plain hash: corruption-evident, but not
      tamper-evident, because anyone able to write the log can recompute it.
      Held separately from the log it protects — a key stored beside the thing
      it guards protects nothing.

  AlertWebhookSecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the Slack/Discord incoming
      webhook URL. A webhook URL is a bearer credential — anyone holding it can
      post to the channel — so it is a secret, not an environment variable, and
      it never appears in this template or in `describe-task-definition` output.
      Without it the deployed Notifier's webhook channel is a silent no-op: it
      counts every send as `skipped`, which is visible in the operational log.

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN in us-east-1. Empty = HTTP only on the ALB DNS name.

  DomainName:
    Type: String
    Default: haris-monitor.com
    Description: Apex domain. Only used when CertificateArn is supplied.

  HostedZoneId:
    Type: String
    Default: Z03982921IDP3L3O35FKU
    Description: Route 53 hosted zone for DomainName.

  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: Fargate vCPU units. 1024 = 1 vCPU.

  TaskMemory:
    Type: String
    Default: "2048"
    Description: >
      Fargate memory in MiB. 2048 against a measured working set of ~198 MB is a
      deliberate ~10x margin: a Fargate OOM kill presents as an unexplained task
      restart loop rather than a diagnosable error.

  ContainerPort:
    Type: Number
    Default: 8501
    Description: Streamlit's port.

  AlertEmail:
    Type: String
    Description: >
      Address that receives deployment alarms. AWS sends a confirmation request
      on first deploy and the subscription delivers NOTHING until that link is
      clicked — a pending subscription looks configured and is inert.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:

  # =========================================================================
  # Network
  #
  # Two public subnets in two availability zones, because an ALB requires
  # subnets in at least two AZs. The task itself runs in one of them with a
  # public IP, which is what lets it pull from ECR without a NAT gateway
  # (~$32/month, deliberately scoped out). It is not reachable from the
  # internet regardless — see the task security group below.
  # =========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: haris-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: haris-igw }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: haris-public-a }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: haris-public-b }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: haris-public-rt }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # Security groups
  #
  # The important line in this whole template is SourceSecurityGroupId on the
  # task group. The task accepts traffic from the LOAD BALANCER'S GROUP, not
  # from an IP range — so there is no address anyone can spoof or route from
  # to reach port 8501. Every request must physically arrive via the ALB.
  # =========================================================================

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (redirected to HTTPS when a certificate is attached)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags: [{ Key: Name, Value: haris-sg-alb }]

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dashboard task - reachable only from the load balancer
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: haris-sg-task }]

  TaskIngressFromAlb:
    # Declared separately from the group so the rule can reference the ALB
    # group without a circular dependency.
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Streamlit, from the ALB security group only

  # =========================================================================
  # Load balancer
  #
  # idle_timeout is raised to 300s because Streamlit holds a WebSocket open for
  # the life of the page. At the 60s default, a dashboard left open while
  # someone talks over it drops its connection and shows "Please wait...".
  # =========================================================================

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: haris-alb
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: haris-tg
      VpcId: !Ref Vpc
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip              # required for Fargate / awsvpc networking
      HealthCheckPath: /_stcore/health   # Streamlit's own endpoint
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        # Streamlit keeps session state server-side, on the far end of a
        # WebSocket. At DesiredCount 1 this changes nothing — but ECS defaults
        # to 100/200 during a rolling deploy, so two tasks run briefly and a
        # client that reconnects in that window can land on the other one and
        # lose its session. The values below match the AWS defaults; they are
        # set explicitly because an inherited default is not a reproducible one.
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "86400"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Condition: HasCertificate
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06   # TLS 1.2 minimum, 1.3 preferred
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  DnsRecord:
    Condition: HasCertificate
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      # An alias, not a plain A record: the ALB's addresses change over time,
      # and a CNAME is not legal at a zone apex.
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  WwwDnsRecord:
    Condition: HasCertificate
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      # The certificate covers *.haris-monitor.com, so a reader reasonably
      # assumes www resolves. Without this record it does not resolve at all —
      # a name the certificate advertises but DNS cannot answer reads as a
      # broken deployment rather than a missing convenience.
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # =========================================================================
  # Identity
  #
  # Two roles, and the split matters.
  #
  # The EXECUTION role is assumed by the ECS agent before any of our code runs:
  # it pulls the image, reads the secrets, and writes log streams. The awslogs
  # driver runs agent-side, which is why the CloudWatch permissions belong here
  # and not on the task role.
  #
  # The TASK role is what the application's own AWS SDK calls would use. Haris
  # makes none, so it has no policies at all. That is not an omission - the
  # container's own credentials can call no AWS API whatsoever.
  # =========================================================================

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/haris
      RetentionInDays: 14

  # =========================================================================
  # Out-of-process alerting
  #
  # Haris has its own Notifier, which reports what Haris observes — a crashed
  # detector, a blocked leak, a failed health probe — over a webhook. It cannot
  # report that Haris is NOT RUNNING, because the code that would send the
  # message is the code that stopped. A crash-loop produces zero notifications
  # from inside the container, indefinitely.
  #
  # This alarm covers exactly that case, from outside the container, on a path
  # that shares no failure mode with the application. In-process alerting
  # handles the application's failures; out-of-process alerting handles the
  # application's absence.
  # =========================================================================

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: haris-alerts
      DisplayName: Haris deployment

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DashboardDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: haris-dashboard-down
      AlarmDescription: >
        No healthy target behind the load balancer - the dashboard is not
        serving. Covers both "running but failing its health check" and "task
        gone entirely".
      Namespace: AWS/ApplicationELB
      # HealthyHostCount, not UnHealthyHostCount. A task that dies completely is
      # DEREGISTERED from the target group, so UnHealthyHostCount reads 0 and an
      # alarm on it would stay silent through the total outage it exists to
      # catch. Counting what is healthy has no such blind spot.
      MetricName: HealthyHostCount
      Statistic: Minimum
      Period: 60
      # Three minutes. ECS keeps the old task serving until the replacement is
      # healthy, so a normal rolling deploy should not dip to zero - but three
      # periods keeps a slow replacement from paging anyone.
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # Missing data means the target group has no targets at all, which is the
      # outage, not the absence of one.
      TreatMissingData: breaching
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      AlarmActions: [!Ref AlertTopic]
      # Recovery is also worth an email: an alarm you only hear about once
      # leaves you unsure whether it is still happening.
      OKActions: [!Ref AlertTopic]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: haris-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: haris-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # This single action cannot be scoped to a resource - the ECR
              # auth token is account-wide by design. Every other action below
              # names exactly one ARN.
              - Sid: EcrAuthTokenCannotBeScoped
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullThisRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/haris
              - Sid: WriteThisLogGroupOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/haris:*
              # Three ARNs, enumerated. Not a prefix, not a wildcard: this role
              # can read exactly these three secrets and nothing else in the
              # account's Secrets Manager.
              - Sid: ReadTheThreeTaskSecretsOnly
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DashboardSecretArn
                  - !Ref AuditKeySecretArn
                  - !Ref AlertWebhookSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: haris-task-role
      Description: >
        Assumed by the application. Intentionally carries no policies: the Haris
        dashboard makes no AWS API calls, so its credentials can do nothing.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # =========================================================================
  # Compute
  # =========================================================================

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: haris-cluster

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: haris
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: dashboard
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # No environment overrides, deliberately.
          #
          # The blank-dashboard fault was never a Streamlit setting. An
          # intercepting proxy on the operator's ISP path relayed the WebSocket
          # handshake over plaintext ws:// and then dropped every client->server
          # frame. Two consequences, both observed: the browser's rerun BackMsg
          # never reached the server, so no script run ever started; and the
          # keepalive pong never came back, so uvicorn's 30s ping plus 30s pong
          # timeout tore the socket down at exactly the 60s mark, producing an
          # endless reconnect loop. Serving over wss:// makes the stream opaque
          # to any such middlebox and resolves it.
          #
          # CORS and XSRF protection therefore stay at their secure defaults,
          # and debug logging is off in normal operation.
          #
          # All three values below are resolved from Secrets Manager by the
          # execution role at task start, so none appears in this template, the
          # image, version control, or `describe-task-definition` output.
          #
          #   HARIS_DASHBOARD_TOKEN - gates the operator console (authentication)
          #   HARIS_AUDIT_KEY       - keys the audit hash chain (integrity)
          #   HARIS_ALERT_WEBHOOK   - where runtime alerts are pushed (notification)
          #
          # The first two answer different questions: who may READ the audit log,
          # and whether the log can be silently REWRITTEN. Neither substitutes for
          # the other, and without the second the chain is corruption-evident
          # only, which is weaker than THREAT_MODEL.md section 2 claims. The
          # third is a bearer credential for a chat channel: without it the
          # Notifier's webhook channel is a silent no-op that counts every send
          # as `skipped`.
          #
          # Note: secrets are read ONCE at task start. Rotating a value in
          # Secrets Manager does not reach a running container - that needs a
          # new task (`ecs update-service --force-new-deployment`, or any change
          # to this task definition).
          Secrets:
            - Name: HARIS_DASHBOARD_TOKEN
              ValueFrom: !Ref DashboardSecretArn
            - Name: HARIS_AUDIT_KEY
              ValueFrom: !Ref AuditKeySecretArn
            - Name: HARIS_ALERT_WEBHOOK
              ValueFrom: !Ref AlertWebhookSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: dashboard

  Service:
    Type: AWS::ECS::Service
    # The listener must exist before the service can register with the target
    # group; without this the stack fails on a race.
    DependsOn: HttpListener
    Properties:
      ServiceName: haris-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      # Without a circuit breaker a bad image is retried indefinitely - the
      # exact "loop forever with no useful error" failure the grace period
      # below is written to avoid. Rollback returns the service to the last
      # task definition that reached a healthy target, automatically.
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      # 180s: the task must pull ~281 MiB of compressed layers (1.32 GB on
      # disk) before Python starts, and Fargate caches nothing between task
      # starts, so every replacement pays the full pull. The app itself is
      # ready in ~2s, but without this grace period ECS can kill the task
      # mid-pull.
      HealthCheckGracePeriodSeconds: 180
      NetworkConfiguration:
        AwsvpcConfiguration:
          # ENABLED is required to reach ECR without a NAT gateway. The task is
          # still unreachable from the internet: the security group admits only
          # the ALB's group.
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: dashboard
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

Outputs:

  LoadBalancerDns:
    Description: The ALB's own hostname - works before any DNS or TLS exists.
    Value: !GetAtt LoadBalancer.DNSName

  HttpUrl:
    Description: Open this to verify the deployment before TLS is attached.
    Value: !Sub http://${LoadBalancer.DNSName}

  HttpsUrl:
    Condition: HasCertificate
    Description: The public dashboard URL.
    Value: !Sub https://${DomainName}

  ClusterName:
    Value: !Ref Cluster

  ServiceName:
    Value: !GetAtt Service.Name

  ExecutionRoleArn:
    Description: Screenshot this role's policy for Appendix B.
    Value: !GetAtt ExecutionRole.Arn

  TaskRoleArn:
    Description: An empty policy list is the least-privilege result, not a missing step.
    Value: !GetAtt TaskRole.Arn

  AlertTopicArn:
    Description: Confirm the email subscription before trusting this to alert.
    Value: !Ref AlertTopic

# ---------------------------------------------------------------------------
# Created by hand, deliberately outside this stack — recorded here so the
# deployment is reproducible from this file plus these four commands.
#
# They are kept out of the stack because they hold state that must survive
# `delete-stack`: the image a rollback would need, and secrets whose loss is
# not recoverable from a template.
#
#   aws ecr create-repository --repository-name haris \
#       --image-tag-mutability IMMUTABLE \
#       --image-scanning-configuration scanOnPush=true
#
#   aws secretsmanager create-secret --name haris/dashboard-token \
#       --description "Operator token gating the dashboard" \
#       --secret-string <256-bit value from a CSPRNG>
#
#   aws secretsmanager create-secret --name haris/audit-key \
#       --description "HMAC key for the Haris audit hash chain" \
#       --secret-string <256-bit value from a CSPRNG>
#
#   aws secretsmanager create-secret --name haris/alert-webhook \
#       --description "Slack/Discord incoming webhook for Haris runtime alerts" \
#       --secret-string <the webhook URL>
#
# Teardown is the mirror image and is scripted in teardown.ps1, which refuses
# to run unless sts:GetCallerIdentity returns this account — `delete-stack`
# against the wrong account fails with "stack does not exist", a message
# indistinguishable from success.
# ---------------------------------------------------------------------------