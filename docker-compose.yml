# Haris — one-command bring-up of the operator dashboard (plan Step 15).
#
#   docker compose up --build      # builds the image and serves the dashboard on :8501
#
# `dashboard` is the operator view (the reachable URL). The structure leaves room to add a
# separate `haris` service later (plan Step 22) that this dashboard would read from.

services:
  dashboard:
    build: .
    image: haris
    ports:
      - "8501:8501"
    # Config passed as env vars. Compose auto-loads a local .env for the ${...} values, so
    # the container starts even with no .env — but the dashboard REQUIRES an operator token
    # (HARIS_DASHBOARD_TOKEN) and fails closed without one. Set it in .env (see .env.example).
    environment:
      HARIS_DASHBOARD_TOKEN: ${HARIS_DASHBOARD_TOKEN:-}
      HARIS_ALERT_WEBHOOK: ${HARIS_ALERT_WEBHOOK:-}
    restart: unless-stopped
