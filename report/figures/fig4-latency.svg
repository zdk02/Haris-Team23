ll="#767676" text-anchor="end">ms</text><rect x="115.0" y="254.6" width="78.0" height="30.4" fill="#bdbdbd" opacity="1.0"/><text x="154.0" y="244.6" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">0.007</text><text x="154.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">no agents</text><text x="154.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">(floor)</text><rect x="245.0" y="226.9" width="78.0" height="58.1" fill="#2f6f4e" opacity="1.0"/><line x1="284.0" y1="233.5" x2="284.0" y2="218.0" stroke="#1a1a1a" stroke-width="1.2"/><line x1="281.0" y1="233.5" x2="287.0" y2="233.5" stroke="#1a1a1a" stroke-width="1.2"/><line x1="281.0" y1="218.0" x2="287.0" y2="218.0" stroke="#1a1a1a" stroke-width="1.2"/><text x="284.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">0.041</text><text x="284.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">Haris</text><text x="284.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">structural</text><rect x="375.0" y="137.4" width="78.0" height="147.6" fill="#e0a458" opacity="1.0"/><line x1="414.0" y1="143.2" x2="414.0" y2="133.4" stroke="#1a1a1a" stroke-width="1.2"/><line x1="411.0" y1="143.2" x2="417.0" y2="143.2" stroke="#1a1a1a" stroke-width="1.2"/><line x1="411.0" y1="133.4" x2="417.0" y2="133.4" stroke="#1a1a1a" stroke-width="1.2"/><text x="414.0" y="123.4" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">12.553</text><text x="414.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">Haris +</text><text x="414.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">Presidio</text><text x="24.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">Mediation cost = arm median minus the no-agents floor: 0.034 ms for the structural agents, 12.55 ms with Presidio.</text><text x="24.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">Presidio buys detection 76% -&gt; 90% and exfiltration 73% -&gt; 76%. Figures are machine-specific; see report/RESULTS.md for the CPU.</text><text x="24.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">The axis is logarithmic: the floor and the structural agents differ from Presidio by three orders of magnitude, and a linear axis hides both.</text></svg>
