<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420"><rect width="860" height="420" fill="white"/><text x="24.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a" text-anchor="start">Taint matching: exact substring vs normalised</text><text x="24.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#767676" text-anchor="start">prevention per family, same corpus, one line of behaviour changed</text><line x1="90.0" y1="300.0" x2="620.0" y2="300.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="82.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="end">0%</text><line x1="90.0" y1="250.0" x2="620.0" y2="250.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="82.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="end">25%</text><line x1="90.0" y1="200.0" x2="620.0" y2="200.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="82.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="end">50%</text><line x1="90.0" y1="150.0" x2="620.0" y2="150.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="82.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="end">75%</text><line x1="90.0" y1="100.0" x2="620.0" y2="100.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="82.0" y="104.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="end">100%</text><line x1="151.5" y1="300.0" x2="213.5" y2="300.0" stroke="#767676" stroke-width="3"/><text x="182.5" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">0%</text><text x="182.5" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="middle">before</text><rect x="231.5" y="234.0" width="62.0" height="66.0" fill="#2f6f4e" opacity="1.0"/><text x="262.5" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">33%</text><text x="262.5" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="middle">after</text><text x="222.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">external_obfuscated</text><rect x="416.5" y="200.0" width="62.0" height="100.0" fill="#767676" opacity="1.0"/><text x="447.5" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">50%</text><text x="447.5" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="middle">before</text><rect x="496.5" y="166.0" width="62.0" height="134.0" fill="#2f6f4e" opacity="1.0"/><text x="527.5" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">67%</text><text x="527.5" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="middle">after</text><text x="487.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="middle">rewrite_chain</text><line x1="640.0" y1="100.0" x2="640.0" y2="310.0" stroke="#d8d8d8" stroke-width="1.0"/><text x="686.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="middle">false positives</text><text x="654.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="start">before:</text><text x="702.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="start">24/192</text><text x="654.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="start">after:</text><text x="702.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1a1a1a" text-anchor="start">24/192</text><text x="702.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#767676" text-anchor="start">both 12%</text><text x="686.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2f6f4e" text-anchor="middle">unchanged</text><text x="24.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">Recall rises on the two families that reformat an identifier; the false-positive rate does not move. That flat pair is</text><text x="24.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">what shows the gain was not bought by making the matcher indiscriminate. Every other family is identical across the two arms.</text><text x="24.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">This fix was once reported as taking obfuscated leaks from 42% to 100%. That family then held a single transform; rebuilt as the</text><text x="24.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#767676" text-anchor="start">six-rung ladder in F3, the same fix recovers the layout rungs only — which is the honest shape of what normalisation can do.</text></svg>
